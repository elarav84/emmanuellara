<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emmanuel Lara | Asesor Patrimonial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #142019;
      --green-800: #1F2E23;
      --green-600: #475940;
      --cream-100: #FAF7F3;
      --cream-200: #F1EADF;
      --ivory: #E9E3D6;
      --brass: #B79A6B;
      --brass-soft: #C7AB7A;
      --ink: #16221A;
      --muted: #667062;
      --line: rgba(183,154,107,.28);
      --shadow: 0 22px 60px rgba(20,32,25,.10);
      --max: 1160px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background: var(--cream-100);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(var(--max), 91%); margin: 0 auto; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250,247,243,.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(183,154,107,.16);
      isolation: isolate;
    }

    .header-inner {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.05rem;
      letter-spacing: -.16em;
      line-height: .72;
      color: var(--brass);
      min-width: 58px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem;
      letter-spacing: .11em;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-subtitle {
      margin-top: 7px;
      font-size: .68rem;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: var(--green-600);
      font-weight: 500;
    }

    .header-cta {
      padding: 12px 20px;
      background: var(--green-800);
      color: var(--cream-100);
      border-radius: 5px;
      font-size: .76rem;
      letter-spacing: .10em;
      text-transform: uppercase;
      font-weight: 700;
      transition: background .2s ease;
    }
    
    .header-cta:hover {
      background: var(--green-600);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 86% 18%, rgba(183,154,107,.16), transparent 20%),
        linear-gradient(110deg, #FAF7F3 0%, #FAF7F3 44%, #EDE4D7 100%);
    }

    .hero-grid {
      min-height: 680px;
      display: grid;
      grid-template-columns: 1fr .92fr;
      gap: 52px;
      align-items: center;
    }

    .hero-copy { padding: 72px 0; }

    .kicker {
      margin-bottom: 20px;
      color: var(--brass);
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 800;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      margin: 0;
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    h1 { font-size: clamp(4.2rem, 7vw, 6.3rem); max-width: 690px; }
    h2 { font-size: clamp(2.7rem, 4.4vw, 4.25rem); }
    h3 { font-size: 1.55rem; }
    .gold { color: var(--brass); }

    p { margin: 0; color: var(--muted); }

    .hero-sub {
      margin: 28px 0 26px;
      max-width: 560px;
      font-size: 1.08rem;
    }

    .claim {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin: 30px 0 32px;
      text-transform: uppercase;
      font-size: .86rem;
      letter-spacing: .065em;
      font-weight: 800;
    }

    .claim::before {
      content: "";
      width: 42px;
      height: 2px;
      background: var(--brass);
      margin-top: 11px;
      flex: 0 0 auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 18px 25px;
      border-radius: 6px;
      background: var(--green-800);
      color: var(--cream-100);
      box-shadow: 0 18px 40px rgba(20,32,25,.18);
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .045em;
      text-transform: uppercase;
      transition: transform .2s ease, background .2s ease;
    }

    .btn svg { flex: 0 0 auto; }

    .btn small {
      display: block;
      margin-top: 3px;
      font-size: .72rem;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      opacity: .86;
    }

    .btn:hover { transform: translateY(-2px); background: var(--green-600); }

    .hero-photo {
      align-self: end;
      position: relative;
      min-height: 630px;
    }

    .hero-photo img {
      position: absolute;
      right: -10px;
      bottom: 0;
      width: min(520px, 100%);
      height: 640px;
      object-fit: cover;
      object-position: center top;
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow);
    }

    .trust {
      background: linear-gradient(90deg, var(--green-900), var(--green-800));
      color: var(--cream-100);
      padding: 26px 0;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .trust-card {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px 14px;
      border-right: 1px solid rgba(183,154,107,.28);
    }

    .trust-card:last-child { border-right: 0; }

    .svg-icon {
      width: 34px;
      height: 34px;
      color: var(--brass);
      flex: 0 0 auto;
    }

    .trust-card strong {
      display: block;
      color: var(--brass-soft);
      font-size: .78rem;
      letter-spacing: .075em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .trust-card span { font-size: .86rem; line-height: 1.
